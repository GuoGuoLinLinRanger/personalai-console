<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PersonalAI Console</title>
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PersonalAI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* ── Design plan ───────────────────────────────────────────────────────────
     Subject: one owner's "life operations" console — half mission-control, half
     RPG character sheet — driven by a conversational assistant, Chaewon.
     Layout: an app shell. Left/centre is a scannable column of grouped cards
     (today, week, review, vitals, trees, habits, objectives, signals); the right
     is a persistent conversation with Chaewon. On phones the two become tabs.
     Signature: Chaewon's presence orb — a warm living gradient that breathes when
     idle, pulses when listening, shimmers when speaking. One accent (warm rose,
     the persona); amber carries progress/XP, green carries "ok/live". Committed
     dark. Type: Hanken Grotesk (UI) + JetBrains Mono (figures & data). */
  :root {
    color-scheme: dark;
    --bg:#0d0f14; --bg-2:#0a0c10;
    --surface:#161a23; --surface-2:#1c212c; --surface-3:#242a37;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
    --text:#e7e9f0; --muted:#98a1b2; --faint:#626a7b;
    --accent:#ff718d; --accent-2:#ff93a8; --accent-soft:rgba(255,113,141,.13); --accent-line:rgba(255,113,141,.4);
    --ok:#4bd089; --ok-soft:rgba(75,208,137,.13);
    --amber:#f3b25b; --amber-soft:rgba(243,178,91,.15);
    --sans:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",monospace;
    --r:15px; --r-sm:10px; --r-xs:7px;
    --shadow:0 10px 30px -18px rgba(0,0,0,.8);
    --ease:cubic-bezier(.22,.7,.26,1);
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:400 14px/1.5 var(--sans); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow:hidden;
    background-image:radial-gradient(1100px 620px at 82% -8%, rgba(255,113,141,.07), transparent 60%),
                     radial-gradient(900px 560px at -6% 108%, rgba(90,120,255,.05), transparent 55%); }
  button { font-family:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  a { color:var(--accent-2); text-decoration:none; } a:hover { color:var(--accent); }
  input { font-family:inherit; }
  ::selection { background:var(--accent-soft); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .scroll { scrollbar-width:thin; scrollbar-color:var(--surface-3) transparent; }
  .scroll::-webkit-scrollbar { width:9px; height:9px; }
  .scroll::-webkit-scrollbar-thumb { background:var(--surface-3); border-radius:9px; border:2px solid var(--bg); }

  /* ── app shell ── */
  #app { height:100%; }
  .shell { overflow:hidden; }
  .shell { height:100%; display:grid; grid-template-rows:auto 1fr; }
  .topbar { display:flex; align-items:center; gap:16px; padding:0 20px; height:56px; border-bottom:1px solid var(--line);
    background:linear-gradient(var(--bg),rgba(13,15,20,.6)); }
  .brand { display:flex; align-items:center; gap:11px; font-weight:700; letter-spacing:-.01em; font-size:15px; }
  .brand .mk { width:26px; height:26px; flex:none; }
  .brand b { color:var(--accent); font-weight:700; }
  .tb-stat { display:flex; align-items:center; gap:7px; font:500 12px var(--mono); color:var(--muted); }
  .tb-stat .lbl { color:var(--faint); text-transform:uppercase; letter-spacing:.08em; font-size:10px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font:500 11px var(--sans);
    letter-spacing:.02em; background:var(--surface-2); color:var(--muted); border:1px solid var(--line); white-space:nowrap; }
  .pill .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.ok { color:var(--ok); background:var(--ok-soft); border-color:transparent; }
  .pill.warn { color:var(--amber); background:var(--amber-soft); border-color:transparent; }
  .pill .dot.live { animation:pulse 2.4s ease-in-out infinite; }
  .tb-sp { margin-left:auto; }
  .iconbtn { width:34px; height:34px; display:grid; place-items:center; border-radius:9px; color:var(--muted);
    transition:background .15s, color .15s; }
  .iconbtn:hover { background:var(--surface-2); color:var(--text); }
  .iconbtn svg { width:18px; height:18px; }
  .ghost { font:500 12.5px var(--sans); color:var(--muted); padding:7px 12px; border-radius:9px; transition:background .15s,color .15s; }
  .ghost:hover { background:var(--surface-2); color:var(--text); }

  .stage { display:grid; grid-template-columns:minmax(0,1fr) 416px; min-height:0; }
  .main { min-width:0; overflow-y:auto; overflow-x:hidden; padding:22px 22px 40px; }
  .wrap { max-width:1180px; margin:0 auto; display:grid; gap:18px; }
  .tabbar { display:none; }

  /* ── cards ── */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; min-width:0; }
  .card-h { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .card-h h2 { margin:0; font:600 11px var(--sans); letter-spacing:.13em; text-transform:uppercase; color:var(--faint); }
  .card-h .meta { margin-left:auto; font:500 12px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums; }
  .card-h .meta.warn { color:var(--amber); } .card-h .meta.ok { color:var(--ok); }
  .card-h .link { margin-left:auto; font:500 11.5px var(--sans); color:var(--accent-2); display:inline-flex; align-items:center; gap:4px; }
  .card-h .link:hover { color:var(--accent); } .card-h .link svg { width:13px; height:13px; }
  .empty { font:400 13px var(--sans); color:var(--faint); padding:4px 0; line-height:1.6; }
  .empty .ex { color:var(--accent-2); }

  .grid { display:grid; gap:18px; grid-template-columns:repeat(2,minmax(0,1fr)); }

  /* hero / today */
  .today-top { display:flex; align-items:flex-start; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  .today-date { font:700 15px var(--sans); letter-spacing:-.01em; color:var(--text); }
  .today-date span { color:var(--faint); font-weight:500; }
  .today-line { font:400 14px var(--sans); color:var(--muted); margin-top:4px; }
  .today-line b { color:var(--text); font-weight:600; }
  .today-cols { display:grid; grid-template-columns:1.1fr 1fr; gap:24px; }
  .subh { font:600 10.5px var(--sans); letter-spacing:.13em; text-transform:uppercase; color:var(--faint); margin:0 0 11px; }

  /* agenda */
  .agenda { display:grid; gap:2px; }
  .ev { display:grid; grid-template-columns:50px 1fr; gap:12px; padding:7px 9px; border-radius:var(--r-xs); position:relative; }
  .ev .t { font:500 12px var(--mono); color:var(--muted); font-variant-numeric:tabular-nums; padding-top:1px; }
  .ev .n { font:500 14px var(--sans); color:var(--text); min-width:0; }
  .ev .n .fx { font:500 9px var(--mono); color:var(--faint); letter-spacing:.1em; margin-left:7px; vertical-align:middle;
    border:1px solid var(--line-2); border-radius:4px; padding:1px 4px; }
  .ev.past { opacity:.42; } .ev.past .n { font-weight:400; }
  .ev.now { background:var(--accent-soft); }
  .ev.now .t { color:var(--accent); } .ev.now::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:2px; border-radius:2px; background:var(--accent); }

  /* queue */
  .queue { display:grid; gap:1px; }
  .q { display:grid; grid-template-columns:auto 1fr auto; gap:11px; align-items:center; padding:8px 9px; border-radius:var(--r-xs); transition:background .12s; }
  .q:hover { background:var(--surface-2); }
  .q .chk { width:17px; height:17px; border-radius:5px; border:1.5px solid var(--line-2); flex:none; position:relative; transition:border-color .12s; cursor:pointer; }
  .q .chk:hover { border-color:var(--ok); }
  .q .chk::after { content:""; position:absolute; inset:3px; border-radius:2px; background:var(--ok); opacity:0; transition:opacity .12s; }
  .q .chk:hover::after { opacity:.45; }
  .q .nd { min-width:0; }
  .q .n { font:500 14px var(--sans); color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:8px; }
  .q .m { font:400 12px var(--sans); color:var(--faint); margin-top:1px; }
  .q .prio { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--faint); flex:none; }
  .q .prio.p5 { background:var(--accent); } .q .prio.p4 { background:var(--amber); }
  .q .m .due.soon { color:var(--amber); }
  .q .rm { width:28px; height:28px; display:grid; place-items:center; border-radius:7px; color:var(--faint); opacity:0; transition:opacity .12s,color .12s,background .12s; }
  .q:hover .rm { opacity:1; } .q .rm:hover { color:var(--accent); background:var(--surface-3); }
  .q .rm svg { width:15px; height:15px; }

  /* week */
  .week-strip { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:14px; }
  .wd { display:grid; gap:5px; justify-items:center; padding:9px 2px; border-radius:var(--r-sm); border:1px solid transparent; transition:background .12s,border-color .12s; }
  .wd:hover { background:var(--surface-2); }
  .wd .l { font:600 10px var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
  .wd .n { font:500 14px var(--mono); color:var(--text); font-variant-numeric:tabular-nums; width:26px; height:26px; display:grid; place-items:center; border-radius:50%; }
  .wd.today .l { color:var(--accent); }
  .wd.today .n { background:var(--accent); color:#1a0d10; font-weight:500; }
  .wd.sel { background:var(--surface-2); border-color:var(--line-2); }
  .wd .cnt { font:500 9.5px var(--sans); color:var(--muted); }
  .wd .cnt.z { color:var(--faint); opacity:.6; }
  .week-list { display:grid; gap:2px; }

  /* review */
  .rv-bars { display:grid; gap:9px; margin-bottom:14px; }
  .rv-bar { display:grid; grid-template-columns:58px 1fr 52px; gap:11px; align-items:center; }
  .rv-bar .k { font:500 11px var(--sans); color:var(--muted); }
  .rv-bar .track { height:8px; border-radius:5px; background:var(--surface-3); overflow:hidden; }
  .rv-bar .track i { display:block; height:100%; border-radius:5px; }
  .rv-bar.planned .track i { background:linear-gradient(90deg,rgba(152,161,178,.5),rgba(152,161,178,.3)); }
  .rv-bar.logged .track i { background:linear-gradient(90deg,var(--accent),var(--accent-2)); }
  .rv-bar .v { font:500 12px var(--mono); color:var(--text); text-align:right; font-variant-numeric:tabular-nums; }
  .spark { display:flex; align-items:flex-end; gap:5px; height:52px; margin-bottom:8px; }
  .spark .col { flex:1; display:grid; gap:5px; justify-items:center; align-content:end; }
  .spark .bar { width:100%; max-width:20px; border-radius:4px 4px 2px 2px; background:var(--surface-3); min-height:3px; }
  .spark .col.t .bar { background:linear-gradient(var(--accent-2),var(--accent)); }
  .spark .dl { font:500 9px var(--sans); letter-spacing:.04em; text-transform:uppercase; color:var(--faint); }
  .rv-foot { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-top:4px; }
  .rv-foot .big { font:700 24px var(--sans); color:var(--text); letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .rv-foot .lbl { font:400 12px var(--sans); color:var(--muted); }
  .rv-foot .delta { font:500 12px var(--mono); margin-left:auto; } .rv-foot .delta.up { color:var(--ok); } .rv-foot .delta.dn { color:var(--amber); }
  .rv-top { font:400 12px var(--sans); color:var(--faint); margin-top:11px; padding-top:11px; border-top:1px solid var(--line); }
  .rv-top b { color:var(--muted); font-weight:600; }

  /* vitals */
  .vt-head { display:flex; align-items:baseline; gap:12px; margin-bottom:16px; }
  .vt-lvl { font:700 34px var(--sans); line-height:1; letter-spacing:-.02em; color:var(--text); font-variant-numeric:tabular-nums; }
  .vt-lvl small { font:600 12px var(--sans); color:var(--faint); letter-spacing:.1em; text-transform:uppercase; margin-right:5px; }
  .vt-xp { font:400 12.5px var(--sans); color:var(--muted); }
  .vt-xp b { color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }
  .vt-attrs { display:grid; gap:10px; }
  .at { display:grid; grid-template-columns:92px 1fr 40px; gap:11px; align-items:center; }
  .at .k { font:500 12px var(--sans); color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .at .track { height:6px; border-radius:4px; background:var(--surface-3); overflow:hidden; }
  .at .track i { display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,var(--amber),#f6c983); }
  .at .v { font:500 11.5px var(--mono); color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }

  /* trees */
  .trees { display:grid; gap:12px; }
  .tree-row { display:grid; grid-template-columns:66px 1fr; gap:12px; align-items:center; }
  .tree-row .k { font:600 10.5px var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .nodes { display:flex; flex-wrap:wrap; gap:5px; }
  .nodes i { width:11px; height:11px; border-radius:3px; background:var(--surface-3); }
  .nodes i.available { background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent-line); }
  .nodes i.in_progress { background:var(--amber); }
  .nodes i.unlocked { background:var(--ok); }
  .leg { display:flex; flex-wrap:wrap; gap:5px 14px; margin-top:4px; font:400 11px var(--sans); color:var(--faint); }
  .leg span { display:inline-flex; align-items:center; gap:6px; } .leg i { width:9px; height:9px; border-radius:3px; }

  /* habits */
  .habits { display:grid; gap:3px; }
  .hb { display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; padding:7px 9px; border-radius:var(--r-xs); }
  .hb:hover { background:var(--surface-2); }
  .hb .n { font:500 14px var(--sans); color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hb .days { display:flex; gap:3px; }
  .hb .days i { width:17px; height:17px; display:grid; place-items:center; border-radius:5px; font:500 10px var(--sans); color:var(--faint); background:var(--surface-2); }
  .hb .days i.on { color:#1a0d10; background:var(--accent-2); font-weight:600; }
  .hb .m { font:400 11.5px var(--mono); color:var(--faint); }

  /* objectives */
  .obj { display:grid; gap:4px; }
  .ob { padding:9px 9px; border-radius:var(--r-xs); }
  .ob:hover { background:var(--surface-2); }
  .ob .n { font:500 14px var(--sans); color:var(--text); }
  .ob .n .tag { font:600 9px var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--amber);
    background:var(--amber-soft); padding:2px 6px; border-radius:5px; margin-right:8px; vertical-align:middle; }
  .ob .track { height:5px; border-radius:4px; background:var(--surface-3); overflow:hidden; margin:8px 0 5px; }
  .ob .track i { display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,var(--accent),var(--accent-2)); }
  .ob .m { font:400 11.5px var(--sans); color:var(--faint); }

  /* signals */
  .sig { display:grid; gap:3px; }
  .sg { display:grid; grid-template-columns:64px 1fr auto; gap:12px; align-items:center; padding:9px 9px; border-radius:var(--r-xs); }
  .sg:hover { background:var(--surface-2); }
  .sg .k { font:600 10px var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--faint); }
  .sg .v { font:400 13px var(--sans); color:var(--text); min-width:0; }
  .sg .v .sub { display:block; font:400 11px var(--sans); color:var(--faint); margin-top:2px; }
  .sg .v a { font-weight:500; display:inline-flex; align-items:center; gap:4px; } .sg .v a svg { width:12px; height:12px; }
  .sg .st { justify-self:end; }
  .sg .edit { color:var(--faint); width:26px; height:26px; display:grid; place-items:center; border-radius:6px; justify-self:end; }
  .sg .edit:hover { color:var(--muted); background:var(--surface-3); } .sg .edit svg { width:13px; height:13px; }

  /* ── chat panel ── */
  .chat { border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; background:linear-gradient(180deg,rgba(22,26,35,.3),var(--bg)); }
  .chat-h { display:flex; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line); }
  .orb-wrap { position:relative; flex:none; width:38px; height:38px; }
  .orb { width:38px; height:38px; border-radius:50%; position:relative;
    background:radial-gradient(circle at 34% 30%, var(--accent-2), var(--accent) 46%, #b5365a 92%);
    box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 0 18px -2px var(--accent-line);
    animation:breathe 4.2s var(--ease) infinite; }
  .orb::after { content:""; position:absolute; inset:0; border-radius:50%; mix-blend-mode:screen; opacity:.5;
    background:radial-gradient(circle at 68% 74%, rgba(120,150,255,.75), transparent 52%); animation:drift 7s ease-in-out infinite; }
  .orb-ring { position:absolute; inset:-5px; border-radius:50%; border:1.5px solid var(--accent-line); opacity:0; pointer-events:none; }
  [data-state="listening"] .orb { animation:pulse-orb 1.3s ease-in-out infinite; }
  [data-state="listening"] .orb-ring { animation:ripple 1.3s ease-out infinite; opacity:1; }
  [data-state="speaking"] .orb { animation:pulse-orb .6s ease-in-out infinite; }
  [data-state="thinking"] .orb { animation:breathe 1.1s var(--ease) infinite; }
  [data-state="offline"] .orb { background:radial-gradient(circle at 34% 30%, #3a414f, #242a37 70%); box-shadow:0 0 0 1px var(--line-2); animation:none; }
  .chat-id { display:grid; gap:1px; }
  .chat-id .nm { font:600 14px var(--sans); color:var(--text); }
  .chat-id .ps { font:500 11px var(--mono); color:var(--muted); letter-spacing:.02em; }
  .chat-id .ps.off { color:var(--faint); }
  .chat-h .iconbtn { margin-left:auto; }

  .thread { flex:1; overflow-y:auto; overflow-x:hidden; padding:20px 18px 10px; display:flex; flex-direction:column; gap:16px; }
  .turn { max-width:94%; min-width:0; }
  .turn.u { align-self:flex-end; max-width:85%; width:fit-content; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font:400 13.5px/1.5 var(--sans); padding:9px 13px; border-radius:14px 14px 4px 14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .turn.a { align-self:stretch; }
  .turn.a .who { font:600 11px var(--sans); color:var(--accent-2); letter-spacing:.04em; margin-bottom:5px; display:flex; align-items:center; gap:7px; }
  .turn.a .who::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .turn.a .who .tm { margin-left:auto; color:var(--faint); font-weight:500; font-family:var(--mono); font-size:10px; }
  .turn.a .body { font:400 14px/1.6 var(--sans); color:var(--text); white-space:pre-wrap; overflow-wrap:anywhere; min-width:0; }
  .turn.a .body b { font-weight:600; } .turn.a .body code { font-family:var(--mono); font-size:.88em; background:var(--surface-2); padding:1px 5px; border-radius:5px; }
  .turn.a .body .sys { color:var(--muted); }
  .thinking { display:inline-flex; gap:4px; padding:2px 0; }
  .thinking i { width:6px; height:6px; border-radius:50%; background:var(--faint); animation:blink 1.2s ease-in-out infinite; }
  .thinking i:nth-child(2){ animation-delay:.2s; } .thinking i:nth-child(3){ animation-delay:.4s; }
  .caps-intro { font:400 14px/1.6 var(--sans); color:var(--text); margin:0 0 12px; }
  .caps { display:grid; gap:12px; }
  .capg .t { font:600 10px var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--amber); margin-bottom:4px; }
  .capg .t.sch { color:var(--accent-2); } .capg .t.bulk { color:var(--ok); } .capg .t.auto { color:var(--faint); }
  .capg .d { font:400 13px/1.7 var(--sans); color:var(--muted); }
  .ex { color:var(--text); cursor:pointer; border-bottom:1px solid var(--line-2); transition:color .12s,border-color .12s; }
  .ex:hover { color:var(--accent); border-color:var(--accent); }
  .confirm { display:flex; gap:8px; align-self:flex-start; margin-top:-6px; }

    shell();
    apiData().then(function(d){ renderData(d); setNet(true);
      pushMsg("assistant",(d.name?"Welcome back, <b>"+esc(d.name)+"</b>. ":"")+CAPS,true);
      startRefresh();
    }).catch(function(err){ if(err&&err.bad) showGate("That link didn’t work — send /ui again and paste the fresh one.");
      else { setNet(false); pushMsg("assistant",'<span class="sys">Can’t reach your assistant right now — check your connection and refresh.</span>',true); startRefresh(); } });
  }

  window.addEventListener("online",function(){ if(token) refresh(); });
  window.addEventListener("offline",function(){ setNet(false); });

  token=getToken(); if(token) boot(); else showGate();
</script>
</body>
</html>
