<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PersonalAI Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg:#080b0f; --bg-2:#0b1015; --bg-3:#0e141a;
    --grid:rgba(125,226,255,.035);
    --line:#17222b; --line-2:#233440; --bracket:#35606e;
    --fg:#cfe0ea; --muted:#74899a; --dim:#45596a; --faint:#39495a;
    --ice:#74e2ff; --amber:#ffb24d; --phos:#6ff0a6; --red:#ff6a6a; --lock:#2b3a44;
    --disp:"Oxanium",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--fg); font-family:var(--mono); font-size:13px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),radial-gradient(900px 420px at 82% -10%,rgba(116,226,255,.05),transparent 60%);
    background-size:44px 44px,44px 44px,100% 100%; background-attachment:fixed;
  }
  .wrap { max-width:1180px; margin:0 auto; padding-inline:18px; padding-block:0 48px; }

  header.hud { position:sticky; top:0; z-index:30; background:linear-gradient(180deg,rgba(8,11,15,.95),rgba(8,11,15,.78)); backdrop-filter:blur(8px); border-bottom:1px solid var(--line-2); }
  .hud-in { max-width:1180px; margin:0 auto; padding:11px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .brand .nm { font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:.22em; text-transform:uppercase; }
  .brand .nm span { color:var(--ice); } .brand .sub { font-size:10px; color:var(--dim); letter-spacing:.3em; text-transform:uppercase; }
  .readout { margin-left:auto; display:flex; align-items:center; gap:18px; font-size:11.5px; color:var(--muted); }
  .readout .k { color:var(--dim); } .readout b { color:var(--fg); font-weight:500; font-variant-numeric:tabular-nums; }
  .readout .live { color:var(--phos); } .readout .live.off { color:var(--amber); }
  .blip { width:6px; height:6px; border-radius:50%; background:var(--phos); display:inline-block; box-shadow:0 0 7px var(--phos); animation:blip 1.9s steps(1) infinite; }
  @keyframes blip { 50% { opacity:.25; } }
  .signout { font-family:var(--disp); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); background:none; border:1px solid var(--line-2); padding:3px 8px; cursor:pointer; }
  .signout:hover { color:var(--muted); }

  .layout { margin-top:20px; display:grid; grid-template-columns:1.5fr 1fr; gap:18px; align-items:start; }
  .col { display:grid; gap:18px; min-width:0; }
  .panel { position:relative; border:1px solid var(--line); background:linear-gradient(180deg,rgba(255,255,255,.012),transparent 120px); }
  .panel.pad { padding:15px 16px 18px; }
  .panel::before,.panel::after { content:""; position:absolute; width:11px; height:11px; pointer-events:none; }
  .panel::before { top:-1px; left:-1px; border-top:2px solid var(--bracket); border-left:2px solid var(--bracket); }
  .panel::after { bottom:-1px; right:-1px; border-bottom:2px solid var(--bracket); border-right:2px solid var(--bracket); }
  .ph { display:flex; align-items:baseline; gap:10px; margin-bottom:13px; padding-bottom:9px; border-bottom:1px solid var(--line); }
  .ph .code { font-family:var(--disp); font-weight:700; color:var(--bracket); font-size:12px; }
  .ph h2 { margin:0; font-family:var(--disp); font-weight:600; font-size:12.5px; letter-spacing:.2em; text-transform:uppercase; }
  .ph .meta { margin-left:auto; font-size:11px; color:var(--dim); letter-spacing:.08em; }

  .chat { display:flex; flex-direction:column; height:72vh; min-height:460px; max-height:780px; }
  .chat-head { display:flex; align-items:center; gap:10px; padding:11px 15px; border-bottom:1px solid var(--line-2); }
  .chat-head .nm { font-family:var(--disp); font-weight:600; letter-spacing:.18em; text-transform:uppercase; font-size:12.5px; }
  .chat-head .helpb { margin-left:auto; font-family:var(--disp); font-weight:600; letter-spacing:.1em; text-transform:uppercase; font-size:10.5px; color:var(--ice); background:transparent; border:1px solid var(--line-2); padding:4px 9px; cursor:pointer; }
  .chat-head .helpb:hover { border-color:var(--ice); }
  .thread { flex:1; min-height:0; overflow-y:auto; padding:16px 15px; display:flex; flex-direction:column; gap:14px; }
  .thread::-webkit-scrollbar { width:8px; } .thread::-webkit-scrollbar-thumb { background:var(--line-2); }
  .msg { max-width:88%; } .msg .who { font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); margin-bottom:4px; display:flex; gap:8px; align-items:center; }
  .msg .who .ts { color:var(--faint); }
  .msg.a .bubble { border:1px solid var(--line-2); border-left:2px solid var(--bracket); background:var(--bg-2); padding:11px 13px; }
  .msg.u { align-self:flex-end; } .msg.u .who { justify-content:flex-end; }
  .msg.u .bubble { border:1px solid var(--line-2); background:var(--bg-3); padding:10px 13px; }
  .bubble { font-size:13px; white-space:pre-wrap; word-break:break-word; } .bubble b { color:var(--fg); font-weight:700; }
  .bubble.sys { color:var(--muted); }
  .typing { color:var(--dim); font-style:normal; letter-spacing:.1em; }
  .caps { display:grid; gap:11px; margin-top:4px; }
  .capg .t { font-family:var(--disp); font-weight:600; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); margin-bottom:5px; }
  .capg .t.c-sch { color:var(--ice); } .capg .t.c-bulk { color:var(--phos); } .capg .t.c-auto { color:var(--muted); }
  .capg .d { font-size:12px; color:var(--muted); }
  .ex { color:var(--fg); cursor:pointer; border-bottom:1px dotted var(--dim); } .ex:hover { color:var(--ice); border-color:var(--ice); }

  .composer { border-top:1px solid var(--line-2); }
  .suggest { display:flex; gap:7px; padding:9px 13px 0; flex-wrap:wrap; }
  .sg { font-size:10.5px; color:var(--muted); border:1px solid var(--line); padding:3px 9px; cursor:pointer; }
  .sg::before { content:"\25B8 "; color:var(--dim); } .sg:hover { color:var(--ice); border-color:var(--bracket); }
  .cin { display:flex; align-items:center; gap:10px; padding:12px 13px; }
  .cin .pr { color:var(--ice); font-weight:700; }
  .cin input { flex:1; min-width:0; background:transparent; border:0; outline:none; color:var(--fg); font-family:var(--mono); font-size:13.5px; caret-color:var(--ice); }
  .cin input::placeholder { color:var(--dim); }
  .send { font-family:var(--disp); font-weight:600; letter-spacing:.14em; text-transform:uppercase; font-size:11px; color:#04171a; background:var(--ice); border:0; padding:8px 14px; cursor:pointer; clip-path:polygon(0 0,100% 0,100% 100%,7px 100%,0 calc(100% - 7px)); }
  .send:hover { filter:brightness(1.1); } .send:disabled { opacity:.5; cursor:default; }

  .ev { display:grid; grid-template-columns:52px 1fr; gap:11px; padding:8px 0; align-items:baseline; border-top:1px solid var(--line); font-size:12.5px; }
  .ev:first-child { border-top:0; } .ev .t { color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; }
  .ev .nm { color:var(--fg); } .ev .fx { font-size:9px; letter-spacing:.12em; color:var(--dim); border:1px solid var(--line-2); padding:0 5px; margin-left:7px; }
  .ev .pl { color:var(--ice); border-color:var(--bracket); }
  .qt { display:flex; align-items:center; gap:9px; padding:7px 0; border-top:1px solid var(--line); font-size:12.5px; }
  .qt:first-child { border-top:0; } .qt .sig { width:3px; align-self:stretch; min-height:16px; background:var(--ice); }
  .qt .nm { flex:1; min-width:0; color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qt .m { font-size:10.5px; color:var(--dim); font-variant-numeric:tabular-nums; } .qt .m .due { color:var(--amber); }
  .empty { font-size:12px; color:var(--dim); padding:4px 0; }
  .lvl { display:flex; align-items:baseline; gap:11px; margin-bottom:11px; }
  .lvl .n { font-family:var(--disp); font-weight:700; font-size:28px; color:var(--amber); line-height:.9; }
  .lvl .lab { font-size:10px; color:var(--dim); letter-spacing:.2em; text-transform:uppercase; }
  .lvl .xp { margin-left:auto; font-size:10.5px; color:var(--muted); text-align:right; }
  .attr { display:grid; grid-template-columns:84px 1fr 34px; gap:9px; align-items:center; margin-top:9px; }
  .attr .k { font-size:11px; color:var(--muted); } .attr .v { font-size:11px; color:var(--fg); text-align:right; font-variant-numeric:tabular-nums; }
  .seg { display:flex; gap:2px; height:8px; } .seg i { flex:1; background:var(--lock); } .seg i.on { background:var(--ice); }
  .trow { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .trow .tk { font-family:var(--disp); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); width:62px; }
  .dots { display:flex; gap:3px; flex-wrap:wrap; } .dots i { width:9px; height:9px; background:var(--lock); display:inline-block; }
  .dots i.available { background:var(--ice); } .dots i.in_progress { background:var(--amber); } .dots i.unlocked { background:var(--phos); }
  .legend { display:flex; flex-wrap:wrap; gap:12px; font-size:10px; color:var(--muted); margin-top:11px; letter-spacing:.04em; }
  .legend i { width:8px; height:8px; display:inline-block; margin-right:5px; vertical-align:middle; }
  .obj .ot { color:var(--fg); margin-bottom:4px; } .obj .os { font-size:11.5px; color:var(--muted); }
  .steps { display:flex; gap:3px; margin-top:11px; } .steps i { flex:1; height:6px; background:var(--lock); } .steps i.on { background:var(--ice); }

  /* setup gate */
  .gate { max-width:520px; margin:12vh auto 0; }
  .gate .panel { padding:24px 22px 26px; }
  .gate h1 { font-family:var(--disp); font-weight:700; letter-spacing:.06em; font-size:20px; margin:0 0 6px; }
  .gate p { color:var(--muted); font-size:13px; margin:0 0 16px; }
  .gate ol { color:var(--muted); font-size:12.5px; padding-left:18px; margin:0 0 16px; display:grid; gap:5px; }
  .gate code { color:var(--ice); }
  .gate input { width:100%; background:var(--bg); border:1px solid var(--line-2); color:var(--fg); padding:11px 12px; font-family:var(--mono); font-size:12.5px; outline:none; margin-bottom:12px; }
  .gate input:focus { border-color:var(--bracket); }
  .gate .err { color:var(--red); font-size:11.5px; margin-bottom:10px; min-height:14px; }
  .gate .send { width:100%; padding:11px; }

  .foot { margin-top:18px; text-align:center; font-size:11px; color:var(--dim); letter-spacing:.06em; }
  @media (max-width:820px) { .layout { grid-template-columns:1fr; } .chat { height:auto; min-height:420px; } .readout { gap:12px; } }
  @media (prefers-reduced-motion:reduce) { .blip { animation:none; } }
</style>
</head>
<body>

<div id="app"></div>

<script>
  var FUNC = "https://yiybhukkzkbntxotgixz.supabase.co/functions/v1";
  var token = null;

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }
  function tnow(){ var d=new Date(); return [d.getHours(),d.getMinutes(),d.getSeconds()].map(function(n){return String(n).padStart(2,"0");}).join(":"); }
  function hhmm(iso){ try { return new Date(iso).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); } catch(e){ return ""; } }
  function dueShort(iso){ if(!iso) return ""; try { var d=new Date(iso); return d.toLocaleDateString([], {weekday:"short"}); } catch(e){ return ""; } }
  function ls(k,v){ try { if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); } catch(e){ return null; } }

  // ---- token bootstrap ----
  function extractToken(s){
    s = (s||"").trim(); if(!s) return null;
    var m = s.match(/[?&#]u=([^&\s]+)/); if(m) return decodeURIComponent(m[1]);
    if (/^[A-Za-z0-9._~\-]+$/.test(s)) return s; // raw token pasted
    return null;
  }
  function getToken(){
    var fromUrl = extractToken(location.search) || extractToken(location.hash);
    if (fromUrl){ ls("pa_token", fromUrl); history.replaceState(null,"",location.pathname); return fromUrl; }
    return ls("pa_token");
  }

  // ---- setup gate ----
  function showGate(msg){
    document.getElementById("app").innerHTML =
      '<div class="wrap"><div class="gate"><section class="panel">'+
      '<h1>Connect your console</h1>'+
      '<p>One-time setup. This links the dashboard to your assistant with your private key.</p>'+
      '<ol><li>In Telegram, message your bot <code>/ui</code>.</li>'+
      '<li>Copy the link it sends back.</li>'+
      '<li>Paste it below — it is stored only in this browser.</li></ol>'+
      '<div class="err" id="gerr">'+(msg?esc(msg):"")+'</div>'+
      '<input id="gin" type="text" placeholder="paste your /ui link or key" autocomplete="off" spellcheck="false">'+
      '<button class="send" id="gbtn">Connect</button>'+
      '</section><div class="foot">PERSONAL.AI // OPERATIONS CONSOLE</div></div></div>';
    document.getElementById("gbtn").onclick = function(){
      var t = extractToken(document.getElementById("gin").value);
      if(!t){ document.getElementById("gerr").textContent = "That doesn't look like a valid link — send /ui and copy the whole thing."; return; }
      ls("pa_token", t); token = t; boot();
    };
    document.getElementById("gin").addEventListener("keydown", function(e){ if(e.key==="Enter") document.getElementById("gbtn").click(); });
  }
  function signOut(){ try{ localStorage.removeItem("pa_token"); }catch(e){} token=null; showGate(); }

  // ---- API ----
  function apiData(){
    return fetch(FUNC+"/dashboard?json=1&u="+encodeURIComponent(token)).then(function(r){
      if(r.status===401||r.status===404) throw {bad:true};
      if(!r.ok) throw {net:true}; return r.json();
    });
  }
  function apiCmd(text){
    return fetch(FUNC+"/telegram-webhook?web=1&u="+encodeURIComponent(token), {
      method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({text:text})
    }).then(function(r){ if(r.status===401||r.status===404) throw {bad:true}; return r.json(); });
  }

  // ---- shell ----
  var CAPS =
    '<p>I run your schedule, tasks and progress from here — just talk to me. I only do these specific things (tap an example):</p><div class="caps">'+
    '<div class="capg"><div class="t">Tasks</div><div class="d"><span class="ex">add OS assignment, 2h, due Thu</span> · <span class="ex">make the essay 3 hours</span> · <span class="ex">finished the essay</span> · <span class="ex">cancel the dentist task</span></div></div>'+
    '<div class="capg"><div class="t c-sch">Schedule</div><div class="d"><span class="ex">plan my day</span> · <span class="ex">plan my week</span> (books Google Calendar after you confirm) · <span class="ex">move my study block to tomorrow</span> · <span class="ex">what should I do now</span></div></div>'+
    '<div class="capg"><div class="t c-bulk">Bulk — one confirmation</div><div class="d"><span class="ex">clear my week except project and leetcode</span> · <span class="ex">mark all my school tasks done</span> · <span class="ex">delete everything overdue</span></div></div>'+
    '<div class="capg"><div class="t">Habits &amp; time</div><div class="d"><span class="ex">gym every mon/wed/fri, 45m</span> · <span class="ex">/log start reading</span> → <span class="ex">done</span> · <span class="ex">did 12 incline pushups</span></div></div>'+
    '<div class="capg"><div class="t">Progress</div><div class="d"><span class="ex">show my skill trees</span> · <span class="ex">start a quest: ship my portfolio by Nov 1</span> · <span class="ex">how many hours did I code this week</span></div></div>'+
    '<div class="capg"><div class="t c-auto">Automatic (background)</div><div class="d">Gmail triage + daily digest · job-application tracking · morning &amp; evening briefings arrive in Telegram.</div></div></div>';

  function shell(name){
    document.getElementById("app").innerHTML =
    '<header class="hud"><div class="hud-in">'+
      '<div style="display:flex;align-items:center;gap:11px">'+
      '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10.5" fill="none" stroke="#74e2ff" stroke-width="1.3"/><circle cx="13" cy="13" r="3.2" fill="none" stroke="#74e2ff" stroke-width="1.3"/><line x1="13" y1="0.5" x2="13" y2="5" stroke="#74e2ff" stroke-width="1.3"/><line x1="13" y1="21" x2="13" y2="25.5" stroke="#74e2ff" stroke-width="1.3"/><line x1="0.5" y1="13" x2="5" y2="13" stroke="#35606e" stroke-width="1.3"/><line x1="21" y1="13" x2="25.5" y2="13" stroke="#35606e" stroke-width="1.3"/></svg>'+
      '<div class="brand"><div class="nm">PERSONAL<span>.AI</span></div><div class="sub">'+esc(name||"operations console")+'</div></div></div>'+
      '<div class="readout"><span><span class="k">TIME</span> <b id="clock">--:--:--</b></span><span class="live" id="netstat"><span class="blip"></span> ONLINE</span><button class="signout" id="signout">Sign out</button></div>'+
    '</div></header>'+
    '<div class="wrap"><div class="layout">'+
      '<section class="panel chat"><div class="chat-head"><span class="nm">Assistant</span><button class="helpb" id="helpb">What can you do?</button></div>'+
        '<div class="thread" id="thread"></div>'+
        '<div class="composer"><div class="suggest" id="suggest">'+
          '<span class="sg">plan my day</span><span class="sg">what\'s today look like</span><span class="sg">clear my week except project and leetcode</span><span class="sg">/log start reading</span><span class="sg">what can you do</span>'+
        '</div><div class="cin"><span class="pr">&gt;</span><input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="Talk to your assistant…"><button class="send" id="send">Send</button></div></div>'+
      '</section>'+
      '<div class="col">'+
        '<section class="panel pad"><div class="ph"><span class="code">01</span><h2>Agenda</h2><span class="meta" id="agdate"></span></div><div id="agenda"></div></section>'+
        '<section class="panel pad"><div class="ph"><span class="code">02</span><h2>Queue</h2><span class="meta" id="qcount"></span></div><div id="queue"></div></section>'+
        '<section class="panel pad" id="objwrap" hidden><div class="ph"><span class="code">03</span><h2>Objective</h2></div><div id="obj"></div></section>'+
        '<section class="panel pad"><div class="ph"><span class="code">04</span><h2>Vitals</h2><span class="meta" id="xpmeta"></span></div><div id="vitals"></div></section>'+
        '<section class="panel pad" id="treewrap"><div class="ph"><span class="code">05</span><h2>Skill Trees</h2></div><div id="trees"></div></section>'+
      '</div>'+
    '</div><div class="foot">SYS:// LIVE · commands &amp; data via your signed link</div></div>';

    (function(){ var c=document.getElementById("clock"); function t(){ if(c) c.textContent=tnow(); } t(); setInterval(t,1000); })();
    document.getElementById("signout").onclick = signOut;
    document.getElementById("send").onclick = function(){ var i=document.getElementById("cmd"); sendMsg(i.value); i.value=""; };
    document.getElementById("cmd").addEventListener("keydown", function(e){ if(e.key==="Enter"){ sendMsg(e.target.value); e.target.value=""; } });
    document.getElementById("suggest").addEventListener("click", function(e){ if(e.target.classList.contains("sg")) sendMsg(e.target.textContent.replace(/^▸\s*/,"")); });
    document.getElementById("helpb").onclick = function(){ pushMsg("assistant", CAPS); };
    document.getElementById("thread").addEventListener("click", function(e){ if(e.target.classList.contains("ex")) sendMsg(e.target.textContent); });
  }

  function pushMsg(role, html){
    var thread = document.getElementById("thread"); if(!thread) return null;
    var m = document.createElement("div"); m.className = "msg "+(role==="user"?"u":"a");
    m.innerHTML = '<div class="who">'+(role==="user"?"You":'<span style="color:var(--ice)">◇</span> Assistant')+' <span class="ts">'+tnow()+'</span></div><div class="bubble">'+html+'</div>';
    thread.appendChild(m); thread.scrollTop = thread.scrollHeight; return m;
  }
  function confirmChips(){
    var thread=document.getElementById("thread");
    var d=document.createElement("div"); d.className="suggest"; d.style.padding="0 0 2px";
    d.innerHTML='<span class="sg">yes</span><span class="sg">cancel</span>';
    thread.appendChild(d); thread.scrollTop=thread.scrollHeight;
    d.addEventListener("click", function(e){ if(e.target.classList.contains("sg")){ d.remove(); sendMsg(e.target.textContent); } });
  }

  var busy=false;
  function sendMsg(text){
    text=(text||"").trim(); if(!text||busy) return;
    if (/^(what can|help$|capabilit|what do you do)/i.test(text)) { pushMsg("user",esc(text)); pushMsg("assistant",CAPS); return; }
    pushMsg("user", esc(text));
    busy=true; document.getElementById("send").disabled=true;
    var t = pushMsg("assistant", '<span class="typing">…working</span>');
    apiCmd(text).then(function(j){
      var replies = (j && j.replies) || [];
      if (t) t.remove();
      if (!replies.length) pushMsg("assistant", '<span class="bubble sys">Done.</span>');
      else replies.forEach(function(r){ pushMsg("assistant", r); }); // backend emits trusted Telegram-HTML
      var joined = replies.join(" ").toLowerCase();
      if (/confirm|commit to google|type the word|unschedule instead|\?$/.test(joined)) confirmChips();
      refresh(); // re-pull live state after any command
    }).catch(function(err){
      if (t) t.remove();
      if (err && err.bad) { pushMsg("assistant", '<span class="bubble sys">Your link is invalid or expired. Sign out and reconnect.</span>'); }
      else pushMsg("assistant", '<span class="bubble sys">Network hiccup — try again.</span>');
    }).then(function(){ busy=false; var s=document.getElementById("send"); if(s) s.disabled=false; });
  }

  // ---- render live data into the rail ----
  function renderData(d){
    var sub = document.querySelector(".brand .sub"); if (sub && d.name) sub.textContent = d.name + " // console";
    var ag = d.today && d.today.events || [];
    document.getElementById("agdate").textContent = new Date().toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}).toUpperCase();
    document.getElementById("agenda").innerHTML = ag.length ? ag.map(function(e){
      return '<div class="ev"><span class="t">'+hhmm(e.start)+'</span><div><span class="nm">'+esc(e.title)+'</span>'+(e.fixed?'<span class="fx">FIXED</span>':'<span class="fx pl">PLAN</span>')+'</div></div>';
    }).join('') : '<div class="empty">Nothing scheduled today.</div>';

    var tasks = d.today && d.today.tasks || [];
    document.getElementById("qcount").textContent = tasks.length + " PENDING";
    document.getElementById("queue").innerHTML = tasks.length ? tasks.map(function(t){
      var due = t.due ? ' · <span class="due">'+esc(dueShort(t.due))+'</span>' : '';
      return '<div class="qt"><span class="sig"></span><span class="nm">'+esc(t.name)+'</span><span class="m">'+(t.mins||0)+'m'+due+'</span></div>';
    }).join('') : '<div class="empty">Queue clear — nothing pending.</div>';

    var q = (d.quests||[])[0];
    var ow = document.getElementById("objwrap");
    if (q){ ow.hidden=false; var pct = q.total ? Math.round(q.done/q.total*100) : 0;
      var seg=""; var N=Math.max(q.total,1); for(var i=0;i<N;i++) seg+='<i class="'+(i<q.done?'on':'')+'"></i>';
      document.getElementById("obj").innerHTML = '<div class="obj"><div class="ot">'+esc(q.title)+'</div><div class="os">'+q.done+' / '+q.total+' steps'+(q.deadline?' · due '+dueShort(q.deadline):'')+'</div><div class="steps">'+seg+'</div></div>';
    } else ow.hidden=true;

    var attrs = (d.attributes||[]).filter(function(a){return a.xp>0;}).slice(0,6);
    var totalXp = (d.attributes||[]).reduce(function(n,a){return n+(a.xp||0);},0);
    var unlocked = (d.nodes||[]).filter(function(n){return n.state==="unlocked";}).length;
    document.getElementById("xpmeta").textContent = unlocked+" UNLOCKED";
    var maxXp = Math.max.apply(null, attrs.map(function(a){return a.xp;}).concat([1]));
    var body = {Strength:1,Mobility:1,Conditioning:1,Balance:1};
    document.getElementById("vitals").innerHTML =
      '<div class="lvl"><span class="n">'+(totalXp?Math.max(1,Math.floor(totalXp/200)):0)+'</span><span class="lab">Level</span><span class="xp">'+totalXp.toLocaleString()+' XP</span></div>'+
      (attrs.length ? attrs.map(function(a){
        var on=Math.max(1,Math.round(a.xp/maxXp*14)); var s="";for(var i=0;i<14;i++)s+='<i class="'+(i<on?'on':'')+'"></i>';
        return '<div class="attr'+(body[a.name]?' body':'')+'"><span class="k">'+esc(a.name)+'</span><div class="seg">'+s+'</div><span class="v">'+a.xp+'</span></div>';
      }).join('') : '<div class="empty">No XP yet — log a session to start a tree.</div>');

    var nodes = d.nodes||[];
    var tw = document.getElementById("treewrap");
    if (!nodes.length){ document.getElementById("trees").innerHTML = '<div class="empty">No skill trees yet — say “show my skill trees” to set them up.</div>'; }
    else {
      var byTree={}; nodes.forEach(function(n){ (byTree[n.tree]=byTree[n.tree]||[]).push(n); });
      var order=["workout","tech"]; var keys=Object.keys(byTree).sort(function(a,b){return order.indexOf(a)-order.indexOf(b);});
      document.getElementById("trees").innerHTML = keys.map(function(k){
        var dots = byTree[k].map(function(n){ return '<i class="'+esc(n.state)+'" title="'+esc(n.name)+'"></i>'; }).join('');
        return '<div class="trow"><span class="tk">'+esc(k)+'</span><div class="dots">'+dots+'</div></div>';
      }).join('') +
      '<div class="legend"><span><i style="background:var(--lock)"></i>Locked</span><span><i style="background:var(--ice)"></i>Available</span><span><i style="background:var(--amber)"></i>Active</span><span><i style="background:var(--phos)"></i>Unlocked</span></div>';
    }
  }

  function setNet(ok){ var n=document.getElementById("netstat"); if(!n) return; n.className="live"+(ok?"":" off"); n.innerHTML='<span class="blip"></span> '+(ok?"ONLINE":"RECONNECT"); }
  function refresh(){ return apiData().then(function(d){ renderData(d); setNet(true); return d; }).catch(function(err){ if(err&&err.bad){ signOut(); } else setNet(false); }); }

  function boot(){
    shell();
    pushMsg("assistant", '<span class="bubble sys">Connecting…</span>');
    apiData().then(function(d){
      document.getElementById("thread").innerHTML = "";
      renderData(d); setNet(true);
      pushMsg("assistant", (d.name?"Welcome back, <b>"+esc(d.name)+"</b>. ":"")+CAPS);
    }).catch(function(err){
      if (err && err.bad) { showGate("That link didn't work — send /ui again and paste the fresh one."); }
      else { document.getElementById("thread").innerHTML=""; setNet(false); pushMsg("assistant",'<span class="bubble sys">Can\'t reach your assistant right now. Check your connection and refresh.</span>'); }
    });
  }

  token = getToken();
  if (token) boot(); else showGate();
</script>
</body>
</html>
